# Publishes the package to PyPI when a GitHub release is published. Uses PyPI "trusted publishing":
# on pypi.org → your project → Publishing → add GitHub as a publisher with owner NaroChatyan, repository
# targetfinder, workflow publish.yml, environment pypi. No token is stored anywhere.
name: publish

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - run: python -m unittest -v
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
