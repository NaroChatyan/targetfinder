rue, 3, "Any Third Party Service", "", "Web", "- Avoid using web application scanners for automatic vulnerability searching which generates massive traffic\r\n- Make every effort not to damage or restrict the availability of products, services, or infrastructure\r\n- Avoid compromising any personal data, interruption, or degradation of any service\r\n- Don’t access or modify other user data, localize all tests to your accounts\r\n- Perform testing only within the scope\r\n- Don’t exploit any DoS/DDoS vulnerabilities, social engineering attacks, or spam\r\n- Don’t spam forms or account creation flows using automated scanners\r\n- In case you find chain vulnerabilities we’ll pay only for vulnerability with the highest severity.\r\n- Don’t break any law and stay in the defined scope\r\n- Any details of found vulnerabilities must not be communicated to anyone who is not a HackenProof Team or an authorized employee of this Company without appropriate permission\r\n- **All communication regarding the program must take place exclusively through the HackenProof platform.\r\nContacting the project team directly through support channels, social media, or any other external communication channels is strictly prohibited.\r\nResearchers who violate this rule may be disqualified from the program and may face account suspension.**", "## IN SCOPE VULNERABILITIES: WEB VULNERABILITIES\r\n We are interested in the following vulnerabilities:\r\n- Business logic issues\r\n- Payments manipulation\r\n- Remote code execution (RCE)\r\n- Injection vulnerabilities (SQL, XXE)\r\n- File inclusions (Local & Remote)\r\n- Access Control Issues (IDOR, Privilege Escalation, etc)\r\n- Leakage of sensitive information\r\n- Server-Side Request Forgery (SSRF)\r\n- Cross-Site Request Forgery (CSRF)\r\n- Cross-Site Scripting (XSS)\r\n- Directory traversal\r\n- Other vulnerabilities with a clear potential loss.\r\n\r\n\r\n## OUT OF SCOPE: WEB VULNERABILITIES\r\n Vulnerabilities found in out of scope resources are unlikely to be rewarded unless they present a serious business risk (at our sole discretion). In general, the following vulnerabilities do not correspond to the severity threshold:\r\n- Vulnerabilities in third-party applications\r\n- Assets that do not belong to the company\r\n- Best practices concerns\r\n- Recently (less than 30 days) disclosed 0day vulnerabilities\r\n- Vulnerabilities affecting users of outdated browsers or platforms\r\n- Social engineering, phishing, physical, or other fraud activities\r\n- Publicly accessible login panels without proof of exploitation\r\n- Reports that state that software is out of date/vulnerable without a proof of concept\r\n- Reports generated by scanners or any automated or active exploit tools\r\n- Vulnerabilities involving active content such as web browser add-ons\r\n- Most brute-forcing issues without clear impact\r\n- Denial of service (DoS/DDoS)\r\n- Theoretical issues\r\n- Moderately Sensitive Information Disclosure\r\n- Spam (sms, email, etc)\r\n- Missing HTTP security headers\r\n- Infrastructure vulnerabilities, including:\r\n  - Certificates/TLS/SSL-related issues; \r\n  - DNS issues (i.e. MX records, SPF records, DMARC records etc.); \r\n  - Server configuration issues (i.e., open ports, TLS, etc.)\r\n- Open redirects\r\n- Session fixation\r\n- User account enumeration\r\n- Clickjacking/Tapjacking and issues only exploitable through clickjacking/tapjacking\r\n- Descriptive error messages (e.g. Stack Traces, application or server errors)\r\n- Self-XSS that cannot be used to exploit other users\r\n- Login & Logout CSRF\r\n- Weak Captcha/Captcha Bypass\r\n- Lack of Secure and HTTPOnly cookie flags\r\n- Username/email enumeration via Login/Forgot Password Page error messages\r\n- CSRF in forms that are available to anonymous users (e.g. the contact form)\r\n- OPTIONS/TRACE HTTP method enabled\r\n- Host header issues without proof-of-concept demonstrating clear security impact\r\n- Content spoofing and text injection issues without showing an attack vector/without being able to modify HTML/CSS\r\n- Content Spoofing without embedded links/HTML\r\n- Reflected File Download (RFD)\r\n- Mixed HTTP Content\r\n- HTTPS Mixed Content Scripts\r\n- Manipulation with Password Reset Token\r\n- MitM and local attacks\r\n- Response manipulations without demonstration of system state change.\r\n- Locally-hosted PoC are not allowed", "- Do not discuss this program or any vulnerabilities (even resolved ones) outside of the program without express consent from the organization\r\n- No vulnerability disclosure, including partial is allowed for the moment\r\n- Platform-Only Disclosure: Disclosure is only possible through the HackenProof Disclosure function\r\n- Researchers must not contact the project team directly regarding any findings, questions, or bounty-related matters. All communication must be conducted through the HackenProof platform only\r\n- Researchers may request disclosure (Limited or Full) within the report ticket\r\n- We reserve the right to approve, redact, or deny disclosure requests at our sole discretion\r\n- Mutual Required: Any publication requires explicit mutual agreement. Reports must remain Private until the status is officially changed to \"Public\" on the HackenProof platform by the team.", "We are happy to thank everyone who submits valid reports which help us improve the security. However, only those that meet the following eligibility requirements may receive a monetary reward:\r\n\r\n- You must be the first reporter of a vulnerability\r\n- The vulnerability must be a qualifying vulnerability\r\n- Any vulnerability found must be reported no later than 24 hours after discovery and exclusively through hackenproof.com\r\n- You must send a clear textual description of the report along with steps to reproduce the issue, include attachments such as screenshots or proof of concept code as necessary\r\n- You must not be a former or current employee of us or one of its contractor\r\n- ONLY USE the EMAIL under which you registered your HackenProof account (in case of violation, no bounty can be awarded)\r\n- Provide detailed but to-the point reproduction steps\r\n- AI-generated reports without runable PoC are not accepted under this program.", {"types": 138, "languages": 141, "platforms": 142, "project_types": 143}, [139, 140], "Web", "apps", [], [], [144], "CEX", [], 22151, {"name": 148, "downtime": 149}, "Active", null, "2000.0", "50.0"]</script></body></html>
