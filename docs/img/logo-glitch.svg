      <text x="264" y="230" opacity="0.2" style="writing-mode: tb; letter-spacing: 4px">ﾂ1ﾌ0ｴ4</text>
      <text x="286" y="40" opacity="0.34" style="writing-mode: tb; letter-spacing: 4px">ｴ1ﾇ0ﾏ8ｸ0ﾒ1ﾍ</text>
      <text x="306" y="180" opacity="0.6" style="writing-mode: tb; letter-spacing: 4px">1ﾎ0ﾋ1ｾ0</text>
