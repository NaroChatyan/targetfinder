<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="TargetFinder: a red sniper scope reticle with a green bug in the crosshair, laser dot on the bug, matrix code and glitch tearing around it" viewBox="0 0 320 320" width="320" height="320" style="display: block; font-family: 'JetBrains Mono', 'DejaVu Sans Mono', 'Noto Sans CJK HK', monospace">
  <defs>
