<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="TargetFinder: a red sniper scope reticle with a green bug in the crosshair, laser dot on the bug, matrix code and glitch tearing around it" viewBox="0 0 320 320" width="320" height="320" style="display: block; font-family: 'JetBrains Mono', 'DejaVu Sans Mono', 'Noto Sans CJK HK', monospace">
  <defs>
    <g id="bug">
      <g stroke="#39ff7a" stroke-width="4.4" stroke-linecap="round" fill="none">
        <line x1="150" y1="126" x2="140" y2="113"></line>
        <line x1="170" y1="126" x2="180" y2="113"></line>
        <line x1="141" y1="155" x2="120" y2="143"></line>
        <line x1="179" y1="155" x2="200" y2="143"></line>
        <line x1="139" y1="170" x2="115" y2="170"></line>
        <line x1="181" y1="170" x2="205" y2="170"></line>
        <line x1="143" y1="185" x2="123" y2="201"></line>
        <line x1="177" y1="185" x2="197" y2="201"></line>
      </g>
      <circle cx="160" cy="135" r="12" fill="#39ff7a"></circle>
      <ellipse cx="160" cy="172" rx="20.5" ry="28.5" fill="#39ff7a"></ellipse>
      <line x1="160" y1="150" x2="160" y2="199" stroke="#0f1114" stroke-width="3" stroke-linecap="round"></line>
      <circle cx="150" cy="165" r="2.5" fill="#0f1114"></circle>
      <circle cx="170" cy="165" r="2.5" fill="#0f1114"></circle>
      <circle cx="148" cy="182" r="2.5" fill="#0f1114"></circle>
      <circle cx="172" cy="182" r="2.5" fill="#0f1114"></circle>
    </g>
    <g id="scope">
      <circle cx="160" cy="160" r="104" fill="none" stroke="#ff3b3b" stroke-width="11"></circle>
      <circle cx="160" cy="160" r="78" fill="none" stroke="#ff3b3b" stroke-width="1.6" opacity="0.5"></circle>
      <line x1="42" y1="160" x2="118" y2="160" stroke="#ff3b3b" stroke-width="5" stroke-linecap="round"></line>
      <line x1="202" y1="160" x2="278" y2="160" stroke="#ff3b3b" stroke-width="5" stroke-linecap="round"></line>
      <line x1="160" y1="42" x2="160" y2="118" stroke="#ff3b3b" stroke-width="5" stroke-linecap="round"></line>
      <line x1="160" y1="202" x2="160" y2="278" stroke="#ff3b3b" stroke-width="5" stroke-linecap="round"></line>
      <circle cx="86" cy="160" r="4" fill="#ff3b3b"></circle>
      <circle cx="234" cy="160" r="4" fill="#ff3b3b"></circle>
      <circle cx="160" cy="86" r="4" fill="#ff3b3b"></circle>
      <circle cx="160" cy="234" r="4" fill="#ff3b3b"></circle>
    </g>
    <g id="mark">
      <use href="#scope"></use>
      <use href="#bug"></use>
      <circle cx="160" cy="160" r="7" fill="#ff3b3b" opacity="0.35"></circle>
      <circle cx="160" cy="160" r="4" fill="#ff3b3b"></circle>
    </g>
    <clipPath id="s1"><rect x="0" y="38" width="320" height="5"></rect></clipPath>
    <clipPath id="s2"><rect x="0" y="64" width="320" height="14"></rect></clipPath>
    <clipPath id="s3"><rect x="0" y="92" width="320" height="9"></rect></clipPath>
    <clipPath id="s4"><rect x="0" y="118" width="320" height="3"></rect></clipPath>
    <clipPath id="s5"><rect x="0" y="151" width="320" height="6"></rect></clipPath>
    <clipPath id="s6"><rect x="0" y="178" width="320" height="7"></rect></clipPath>
    <clipPath id="s7"><rect x="0" y="213" width="320" height="12"></rect></clipPath>
    <clipPath id="s8"><rect x="0" y="246" width="320" height="4"></rect></clipPath>
    <clipPath id="s9"><rect x="0" y="268" width="320" height="10"></rect></clipPath>
    <clipPath id="s10"><rect x="0" y="296" width="320" height="5"></rect></clipPath>
    <clipPath id="v1"><rect x="58" y="0" width="6" height="320"></rect></clipPath>
    <clipPath id="v2"><rect x="228" y="0" width="10" height="320"></rect></clipPath>
    <clipPath id="v3"><rect x="166" y="0" width="4" height="320"></rect></clipPath>
    <filter id="cyan"><feColorMatrix type="hueRotate" values="180"></feColorMatrix></filter>
    <filter id="magenta"><feColorMatrix type="hueRotate" values="300"></feColorMatrix></filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="4" height="1" fill="#000000" opacity="0.3"></rect></pattern>
  </defs>
  <rect x="0" y="0" width="320" height="320" fill="#0f1114"></rect>
  
  <use href="#mark"></use>
  
</svg>